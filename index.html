<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Attention Trainer</title>
  <meta name="apple-mobile-web-app-title" id="appleWebAppTitle" content="Attention Trainer">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Rubik:wght@600;700;800&family=Noto+Sans+Arabic:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <style>
    [hidden] { display: none !important; }
    .app--guest .header,
    .app--guest .main { visibility: hidden; pointer-events: none; }
    .app--guest { pointer-events: none; }
    .auth-overlay {
      position: fixed; inset: 0; z-index: 400;
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem; background: rgba(30, 27, 75, 0.5);
      pointer-events: auto;
    }
    .auth-shell { pointer-events: auto; position: relative; z-index: 1; }
    .auth-card { pointer-events: auto; position: relative; z-index: 1; }
    .auth-lang-picker { pointer-events: auto; position: relative; z-index: 20; }
    .auth-overlay[hidden] { display: none !important; }
    #loadError[hidden] { display: none !important; pointer-events: none !important; }
    button, .auth-form__link { touch-action: manipulation; cursor: pointer; }
  </style>
</head>
<body>
  <div id="loadError" hidden class="load-error">
    <p id="loadErrorText"></p>
  </div>

  <div class="bg-decor" aria-hidden="true">
    <span class="bg-decor__blob bg-decor__blob--1"></span>
    <span class="bg-decor__blob bg-decor__blob--2"></span>
    <span class="bg-decor__blob bg-decor__blob--3"></span>
  </div>

  <div class="auth-overlay" id="authOverlay">
    <div class="auth-shell">
      <div class="auth-lang-picker picker picker--lang">
        <button type="button" class="picker__btn picker__btn--labeled" id="authLangBtn" aria-haspopup="listbox">
          <span class="picker__btn-icon" id="authLangBtnFlag">🇺🇸</span>
          <span class="picker__btn-text" id="authLangBtnText">English</span>
        </button>
        <div class="picker__menu picker__menu--center" id="authLangMenu" hidden role="listbox"></div>
      </div>
      <div class="auth-card">
      <div class="auth-card__emoji" aria-hidden="true">🔐</div>
      <div class="auth-tabs" id="authTabs" role="tablist">
        <button class="auth-tabs__btn auth-tabs__btn--active" id="authTabLogin" type="button" data-i18n="authLogin">Log in</button>
        <button class="auth-tabs__btn" id="authTabRegister" type="button" data-i18n="authRegister">Sign up</button>
      </div>
      <h1 class="auth-card__title" id="authTitle" data-i18n="authLoginTitle">Log in</h1>
      <p class="auth-card__subtitle" id="authSaveScoreHint" data-i18n="authSaveScoreHint">
        Sign in or create an account. Your score and streak will stay with you when you leave.
      </p>
      <form class="auth-form" id="authForm" novalidate>
        <label class="auth-field">
          <span class="auth-field__label" data-i18n="authUsername">Username</span>
          <input class="auth-field__input" id="authUsername" type="text" autocomplete="username" required>
        </label>
        <label class="auth-field" id="authEmailWrap" hidden>
          <span class="auth-field__label" data-i18n="authEmail">Email</span>
          <input class="auth-field__input" id="authEmail" type="email" autocomplete="email" inputmode="email">
        </label>
        <label class="auth-field">
          <span class="auth-field__label" id="authPasswordLabel" data-i18n="authPassword">Password</span>
          <input class="auth-field__input" id="authPassword" type="password" autocomplete="current-password" required>
        </label>
        <label class="auth-field" id="authConfirmWrap" hidden>
          <span class="auth-field__label" data-i18n="authPasswordConfirm">Confirm password</span>
          <input class="auth-field__input" id="authPasswordConfirm" type="password" autocomplete="new-password">
        </label>
        <p class="auth-form__hint" id="authResetHint" hidden data-i18n="authResetHint"></p>
        <p class="auth-form__error" id="authError" hidden></p>
        <p class="auth-form__success" id="authSuccess" hidden></p>
        <button class="btn btn--primary btn--large auth-form__submit" id="authSubmit" type="submit" data-i18n="authSubmitLogin">Log in</button>
      </form>
      <p class="auth-form__link-wrap" id="authForgotWrap">
        <button class="auth-form__link" id="authForgotBtn" type="button" data-i18n="authForgotPassword" onclick="window.openPasswordReset&&window.openPasswordReset();return false;">Forgot password?</button>
      </p>
      <p class="auth-form__link-wrap" id="authBackLoginWrap" hidden>
        <button class="auth-form__link" id="authBackLoginBtn" type="button" data-i18n="authBackToLogin">Back to log in</button>
      </p>
      <button class="btn btn--secondary auth-form__guest" id="authGuestBtn" type="button" data-i18n="authPlayAsGuest" onclick="window.enterAsGuest&&window.enterAsGuest();return false;">
        No account? Play anyway
      </button>
      </div>
    </div>
  </div>

  <div class="app app--guest" id="app">
    <header class="header" id="appHeader" hidden>
      <div class="header__row">
        <div class="header__bar">
          <div class="picker picker--age">
            <button class="picker__btn picker__btn--labeled" id="ageBtn" type="button">
              <span class="picker__btn-text" id="ageBtnText">Level 1</span>
            </button>
            <div class="picker__menu picker__menu--drop" id="ageMenu" hidden></div>
          </div>

          <div class="picker picker--lang">
            <button class="picker__btn picker__btn--labeled" id="langBtn" type="button">
              <span class="picker__btn-icon" id="langBtnFlag">🇺🇸</span>
              <span class="picker__btn-text" id="langBtnText">English</span>
            </button>
            <div class="picker__menu picker__menu--center" id="langMenu" hidden></div>
          </div>

          <div class="theme-switch" role="group" aria-label="Theme">
            <button class="theme-switch__btn" id="themeLightBtn" type="button" data-theme-value="light">
              <span class="theme-switch__icon">☀️</span>
              <span class="theme-switch__label" data-i18n="themeBright">Light</span>
            </button>
            <button class="theme-switch__btn" id="themeDarkBtn" type="button" data-theme-value="dark">
              <span class="theme-switch__icon">🌙</span>
              <span class="theme-switch__label" data-i18n="themeDarkSide">Dark</span>
            </button>
          </div>
        </div>

        <div class="account-chip picker picker--account" id="accountPanel">
          <button class="account-chip__btn" id="accountBtn" type="button" aria-haspopup="menu">
            <span class="account-chip__avatar" aria-hidden="true">👤</span>
            <span class="account-chip__name" id="accountBtnName">Guest</span>
            <span class="account-chip__caret" aria-hidden="true">▾</span>
          </button>
          <div class="picker__menu account-menu" id="accountMenu" hidden>
            <p class="account-menu__title" id="accountMenuName"></p>
            <button type="button" class="picker__item" id="accountLogoutBtn" data-i18n="authLogout">Log out</button>
            <button type="button" class="picker__item account-menu__danger" id="accountDeleteBtn" hidden data-i18n="authDeleteAccount">Delete account</button>
          </div>
        </div>
      </div>

      <div class="header__score-row" id="scoreRow" hidden>
        <span class="score">
          <span class="score__label" data-i18n="score">Счёт</span>
          <span class="score__value" id="scoreValue">0</span>
        </span>
        <span class="score score--total" id="totalScoreWrap" hidden>
          <span class="score__label" data-i18n="totalScore">Всего</span>
          <span class="score__value" id="totalScoreValue">0</span>
        </span>
        <span class="score streak" id="streakRow" hidden>
          <span class="score__label" data-i18n="streakLabel">Серия побед</span>
          <span class="score__value" id="streakValue">0</span>
        </span>
      </div>
    </header>

    <main class="main">
      <section class="game" id="gameScreen" hidden>
        <div class="timer" id="timerBar" role="timer" aria-live="polite">
          <div class="timer__track">
            <div class="timer__fill" id="timerFill"></div>
          </div>
          <span class="timer__seconds" id="timerSeconds">10</span>
        </div>

        <p class="game-hint" id="gameHint" aria-live="polite"></p>

        <div class="game-panel">
          <div class="game-field" id="gameField" role="group" aria-label="Game field"></div>
        </div>

        <button class="btn btn--secondary" id="newGameBtn" type="button" data-i18n="newGame">
          Закончить игру
        </button>
      </section>

      <div class="start-overlay" id="startOverlay">
        <div class="welcome-card">
          <div class="welcome__emoji" aria-hidden="true">👀</div>
          <h1 class="welcome__title" data-i18n="title">Тренажёр внимания</h1>
          <p class="welcome__hint" data-i18n="hint">Найди отличающийся объект</p>
          <button class="btn btn--primary btn--large" id="startBtn" type="button" data-i18n="start">
            Начать
          </button>
        </div>
      </div>

      <div class="tutorial-overlay" id="tutorialOverlay" hidden>
        <div class="tutorial-card">
          <div class="tutorial-card__emoji" id="tutorialEmoji" aria-hidden="true"></div>
          <h2 class="tutorial-card__title" id="tutorialTitle"></h2>
          <p class="tutorial-card__text" id="tutorialText"></p>
          <div class="tutorial-card__dots" id="tutorialDots" aria-hidden="true"></div>
          <div class="tutorial-card__actions">
            <button class="btn btn--primary btn--large" id="tutorialNextBtn" type="button"></button>
          </div>
        </div>
      </div>

      <div class="tutorial-banner" id="tutorialBanner" hidden>
        <p class="tutorial-banner__text" id="tutorialBannerText"></p>
        <span class="tutorial-banner__progress" id="tutorialBannerProgress"></span>
      </div>

      <div class="overlay" id="deleteAccountOverlay" hidden>
        <div class="overlay__card overlay__card--confirm">
          <div class="overlay__emoji" aria-hidden="true">⚠️</div>
          <p class="overlay__text overlay__text--confirm" id="deleteAccountText" data-i18n="authDeleteConfirm">
            Delete your account? This cannot be undone.
          </p>
          <div class="confirm-actions">
            <button class="btn btn--secondary" id="deleteAccountCancel" type="button" data-i18n="authDeleteCancel">Cancel</button>
            <button class="btn btn--danger" id="deleteAccountConfirm" type="button" data-i18n="authDeleteConfirmBtn">Delete</button>
          </div>
        </div>
      </div>

      <div class="overlay" id="feedbackOverlay" hidden>
        <div class="overlay__card" id="feedbackCard">
          <div class="overlay__emoji" id="feedbackEmoji" aria-hidden="true"></div>
          <p class="overlay__text" id="feedbackText"></p>
          <button class="btn btn--primary btn--large" id="feedbackBtn" type="button"></button>
        </div>
      </div>
    </main>
  </div>

  <script>
    (function () {
      var AUTH_LANGS = [
        ['en', '🇺🇸', 'English'], ['ru', '🇷🇺', 'Русский'], ['uk', '🇺🇦', 'Українська'],
        ['de', '🇩🇪', 'Deutsch'], ['fr', '🇫🇷', 'Français'], ['es', '🇪🇸', 'Español'],
        ['it', '🇮🇹', 'Italiano'], ['pt', '🇵🇹', 'Português'], ['pl', '🇵🇱', 'Polski'],
        ['tr', '🇹🇷', 'Türkçe'], ['ar', '🇸🇦', 'العربية'], ['he', '🇮🇱', 'עברית'],
        ['zh', '🇨🇳', '中文'], ['ja', '🇯🇵', '日本語'], ['ko', '🇰🇷', '한국어']
      ];

      function positionAuthLangMenu() {
        var btn = document.getElementById('authLangBtn');
        var menu = document.getElementById('authLangMenu');
        if (!btn || !menu || menu.hidden) return;
        var r = btn.getBoundingClientRect();
        var w = menu.offsetWidth || 200;
        var left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, window.innerWidth - w - 8));
        menu.style.top = (r.bottom + 6) + 'px';
        menu.style.left = left + 'px';
      }

      function setAuthLangBtn(code) {
        var opt = AUTH_LANGS.find(function (l) { return l[0] === code; }) || AUTH_LANGS[0];
        var flag = document.getElementById('authLangBtnFlag');
        var text = document.getElementById('authLangBtnText');
        if (flag) flag.textContent = opt[1];
        if (text) text.textContent = opt[2];
      }

      function setTabTitle(code) {
        if (!window.I18n) return;
        var title = window.I18n.t(code, 'title');
        document.title = title;
        var meta = document.getElementById('appleWebAppTitle');
        if (meta) meta.content = title;
      }

      function applyAuthLangNow(code) {
        localStorage.setItem('guestLang', code);
        setAuthLangBtn(code);
        if (typeof window.__applyAuthLanguage === 'function') {
          window.__applyAuthLanguage(code);
        } else if (window.I18n && window.UI && window.UI.applyTranslations) {
          window.UI.applyTranslations(code);
          document.documentElement.dir = window.I18n.isRtl(code) ? 'rtl' : 'ltr';
        } else if (window.I18n && window.AuthUI && window.AuthUI.updateAuthFormTexts) {
          window.AuthUI.updateAuthFormTexts(code);
          document.documentElement.lang = code;
          document.documentElement.dir = window.I18n.isRtl(code) ? 'rtl' : 'ltr';
        }
        setTabTitle(code);
      }

      function initAuthLangEarly() {
        var btn = document.getElementById('authLangBtn');
        var menu = document.getElementById('authLangMenu');
        if (!btn || !menu || btn.dataset.langPickerBound === '1') return;
        btn.dataset.langPickerBound = '1';

        var stored = localStorage.getItem('guestLang') || 'en';
        setAuthLangBtn(stored);
        menu.innerHTML = AUTH_LANGS.map(function (l) {
          return '<button type="button" class="picker__item" data-lang="' + l[0] + '">' + l[1] + ' ' + l[2] + '</button>';
        }).join('');

        btn.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          var wasOpen = !menu.hidden;
          document.querySelectorAll('.picker__menu').forEach(function (m) { m.hidden = true; });
          menu.hidden = wasOpen;
          if (!menu.hidden) requestAnimationFrame(positionAuthLangMenu);
        });

        menu.addEventListener('click', function (e) { e.stopPropagation(); });
        menu.querySelectorAll('.picker__item').forEach(function (item) {
          item.addEventListener('click', function () {
            applyAuthLangNow(item.dataset.lang);
            menu.hidden = true;
            window.dispatchEvent(new CustomEvent('authLangChange', { detail: { lang: item.dataset.lang } }));
          });
        });

        document.addEventListener('click', function () { menu.hidden = true; });
        window.addEventListener('resize', positionAuthLangMenu);

        applyAuthLangNow(stored);
      }

      function initAuthActionsEarly() {
        window.openPasswordReset = window.openPasswordReset || function () {
          if (!window.AuthUI) return;
          window.AuthUI.clearAuthError();
          window.AuthUI.clearAuthSuccess();
          window.AuthUI.setAuthMode('reset');
          var lang = localStorage.getItem('guestLang') || 'en';
          if (typeof window.__applyAuthLanguage === 'function') window.__applyAuthLanguage(lang);
          else window.AuthUI.updateAuthFormTexts(lang);
        };
        window.openLoginForm = window.openLoginForm || function () {
          if (!window.AuthUI) return;
          window.AuthUI.clearAuthError();
          window.AuthUI.clearAuthSuccess();
          var form = document.getElementById('authForm');
          if (form) form.reset();
          window.AuthUI.setAuthMode('login');
          var lang = localStorage.getItem('guestLang') || 'en';
          if (typeof window.__applyAuthLanguage === 'function') window.__applyAuthLanguage(lang);
          else window.AuthUI.updateAuthFormTexts(lang);
        };
        window.enterAsGuest = window.enterAsGuest || function () {
          if (window.Auth && window.Auth.setGuestSession) window.Auth.setGuestSession();
          var overlay = document.getElementById('authOverlay');
          var app = document.getElementById('app');
          var start = document.getElementById('startOverlay');
          if (overlay) overlay.hidden = true;
          if (app) app.classList.remove('app--guest');
          if (start) start.hidden = false;
        };
      }

      function fixStuckScreen() {
        var overlay = document.getElementById('authOverlay');
        var app = document.getElementById('app');
        if (overlay && app && app.classList.contains('app--guest') && overlay.hidden) {
          overlay.hidden = false;
        }
      }

      document.addEventListener('DOMContentLoaded', function () {
        fixStuckScreen();
        initAuthLangEarly();
        initAuthActionsEarly();
      });
      window.addEventListener('load', function () {
        var lang = localStorage.getItem('guestLang') || 'en';
        if (typeof window.__applyAuthLanguage === 'function') {
          window.__applyAuthLanguage(lang);
        }
      });
    })();
  </script>
  <script src="main.js?v=38"></script>
</body>
</html>
